
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GastroMatch - Pesquisar</title>

    <link rel="icon" href="../img/logo.png" type="image/png">
    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="../css/pesquisar.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
        rel="stylesheet">
</head>

<body>

    <header id="menu-principal"></header>

    <main class="pagina-pesquisa">

        <div class="catalog-search">
            <div class="catalog-search-field">
                <span class="material-symbols-outlined">search</span>

                <input
                    type="text"
                    id="campoPesquisa"
                    placeholder="Pesquise receitas, cursos..."
                    autocomplete="off">
            </div>
        </div>

        <section class="secao-pesquisa">

            <h1 id="tituloResultados">Indicações da casa.</h1>

            <div class="grid-resultados" id="resultados"></div>

        </section>

    </main>

    <script src="../js/menu.js"></script>
    <script src="../js/proteger.js"></script>
    <script>
        renderMenu("#menu-principal");
    </script>

    <script src="../js/pesquisar.js"></script>

</body>
</html>
