<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroMatch - Login</title>

    <link rel="stylesheet" href="../css/login.css">
    <link rel="icon" href="../img/logo.png" type="image/png">
</head>

<body>

    <main class="pagina">
        <section class="forme">

            <h2>Pronto para se juntar à <br><span>GastroMatch</span>?</h2>

            <form id="form" novalidate>

                <div class="campo">
                    <input type="email" id="email" placeholder="Digite seu e-mail">
                    <small id="erro-email" class="erro"></small>
                </div>

                <div class="campo">
                    <input type="password" id="senha" placeholder="Digite sua senha">
                    <small id="erro-senha" class="erro"></small>
                </div>

                <div class="campo">
                    <input class="botao" type="submit" value="Entrar">
                </div>

                <div class="campo">
                    <a class="botao cadastro" href="cadastro.html">
                        Cadastre-se
                    </a>
                </div>

            </form>




        </section>

        <section class="imagem">

            <img src="../img/foto-login.png" alt="Prato de comida">

            <p>Bem vindo!</p>

        </section>


    </main>

    <script src="../js/login.js"></script>

</body>

</html>
