<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GastroMatch - Curso</title>

    <link rel="stylesheet" href="../css/compra.css">

    <link rel="stylesheet" href="../css/estilo.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
        rel="stylesheet"
    >
 <link rel="icon" href="../img/logo.png" type="image/png">
</head>

<body>

<header id="menu-principal"></header>


<main class="course-page">

    <!-- =========================
         INFORMAÇÕES DO CURSO
         ========================= -->

    <section class="course-intro" aria-labelledby="course-title">

        <div class="course-cover">

            <img
                id="course-image"
                src=""
                alt="Imagem do curso"
            >

            <button
                type="button"
                class="favorite-button"
                aria-label="Adicionar curso aos favoritos"
            >
                
            </button>

        </div>


        <div class="course-details">

            <span id="course-category" class="course-category">
                Categoria
            </span>

            <h1 id="course-title">
                Carregando...
            </h1>


            <p
                class="course-description"
                id="course-description"
            >
                Carregando descrição...
            </p>


            <dl class="course-info">

                <div>

                    <dt>Aulas</dt>

                    <dd id="course-lessons">
                        -
                    </dd>

                </div>


                <div>

                    <dt>Duração</dt>

                    <dd id="course-duration">
                        -
                    </dd>

                </div>


                <div>

                    <dt>Preço</dt>

                    <dd id="course-price">
                        R$ 0,00
                    </dd>

                </div>

            </dl>


            <a
                class="buy-button"
                id="buy-button"
                href="#"
            >
                Obter
            </a>

        </div>

    </section>


    <!-- =========================
         CONTEÚDO
         ========================= -->

    <section
        class="course-content"
        aria-labelledby="learning-title"
    >

        <div class="learning-list">

            <h2 id="learning-title">
                O que vamos aprender?
            </h2>

            <ul id="course-lessons-list">
            </ul>

        </div>


<aside class="instructor-card" aria-label="Instrutor do curso">
    <div class="instructor-info">
        <small>Instrutor do curso</small>
        <span id="instructor-name">Carregando...</span>
    </div>
</aside>

    </section>

</main>


<script src="../js/menu.js"></script>

<script src="../js/compra.js"></script>

<script>
    renderMenu("#menu-principal");
</script>

</body>

</html>
