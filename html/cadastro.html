<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroMatch - Cadastro</title>

    <link rel="stylesheet" href="../css/login.css">
    <link rel="icon" href="../img/logo.png" type="image/png">
</head>

<body>

    <main class="pagina">
        <section class="forme">

            <h2>Pronto para se juntar à <br><span>GastroMatch</span>?</h2>

            <form id="form" novalidate>

                <div class="campo">
                    <label for="name"></label>
                    <input type="text" id="nome" placeholder="Digite seu nome">
                    <small id="erro-name" class="erro"></small>
                </div>

                <div class="campo">
                    <input type="email" id="email" placeholder="Digite seu e-mail">
                    <small id="erro-email" class="erro"></small>
                </div>

                <div class="campo">
                    <input type="password" id="senha" placeholder="Digite sua senha">
                    <small id="erro-senha" class="erro"></small>
                </div>

                <div class="campo">
                    <label for="telefone"></label>
                    <input type="tel" id="telefone" placeholder="(00) 00000-0000" autocomplete="tel">
                </div>

                <div class="campo">
                    <select name="tipo_usuario" id="tipo_usuario">
                        <option value="">Selecione o tipo de usuário</option>
                        <option value="cliente">Cliente</option>
                        <option value="restaurante">Chef</option>
                        <option value="restaurante">Restaurante</option>
                    </select>
                </div>

                <div class="campo">
                    <input class="botao" type="submit" value="Cadastrar">
                </div>


                <div class="campo">
                    <a class="botao cadastro" href="login.html">
                        Voltar para login
                    </a>
                </div>

            </form>

        </section>

        <section class="imagem">

            <img src="../img/foto-login.png" alt="Prato de comida">

            <p>Crie sua conta.</p>

        </section>


    </main>

    <script src="../js/cadastrar.js"></script>

</body>

</html>
