<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GastroMatch - Todos os cursos</title>

    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="../css/aulas.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
rel="stylesheet">

 <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0"
  rel="stylesheet">
    

    <link rel="icon" href="../img/logo.png" type="image/png">
</head>

<body data-tipo-atividade="1">

    <header id="menu-principal"></header>

    <main>

        <section class="courses-catalog">

            <div class="catalog-search">

                <label class="catalog-search-field" for="buscar-curso">

                    <span class="material-symbols-outlined">
                        search
                    </span>

                    <input
                        id="buscar-curso"
                        type="search"
                        placeholder="Busque por um curso"
                        aria-label="Buscar cursos"
                    >

                </label>

            </div>

            <div class="catalog-heading">

                <h2>Todos os cursos</h2>

            </div>

            <div class="todos-grid" id="todos-cursos"></div>

        </section>

    </main>

    <script src="../js/menu.js"></script>
    <script src="../js/todos.js"></script>

    <script>
        renderMenu("#menu-principal");
    </script>

</body>

</html>
